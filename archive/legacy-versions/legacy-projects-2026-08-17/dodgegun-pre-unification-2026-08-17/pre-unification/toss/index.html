<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#15191e" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>도지건</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="rotate-gate">
      <strong>도지건</strong>
      <p>휴대폰을 가로로 눕혀 주세요</p>
    </div>

    <div id="screen-splash" hidden>
      <img class="splash-img" src="/assets/splash-studio-zzg.png" alt="STUDIO ZZG" draggable="false" />
    </div>

    <canvas id="game" aria-label="도지건 게임 화면"></canvas>

    <div id="hud" hidden>
      <div class="fighter-hud left">
        <div class="hud-main">
          <div class="nameplate" id="you-name">YOU</div>
          <div class="health" id="player-health">
            <span class="hp-segment active"></span><span class="hp-segment active"></span><span class="hp-segment active"></span>
          </div>
        </div>
        <div class="ammo-rack" id="player-ammo"></div>
      </div>
      <div class="match-meta">
        <div id="scoreboard">0 — 0</div>
        <div id="round-clock">40</div>
      </div>
      <div class="fighter-hud right">
        <div class="hud-main">
          <div class="health" id="enemy-health">
            <span class="hp-segment active"></span><span class="hp-segment active"></span><span class="hp-segment active"></span>
          </div>
          <div class="nameplate" id="foe-name">AI</div>
        </div>
      </div>
    </div>
    <div id="state"></div>

    <div id="tutorial-tip" hidden>
      <span class="tip-step" id="tip-step">1 / 3</span>
      <span class="tip-text" id="tip-text"></span>
      <button type="button" id="btn-tutorial-skip">건너뛰기</button>
    </div>

    <div id="controls" hidden>
      <div class="stick" id="stick-move"><i class="knob"></i><span>이동</span></div>
      <div class="right-cluster">
        <button type="button" id="btn-reload">장전</button>
        <div class="stick" id="stick-aim"><i class="knob"></i><span>조준·발사</span></div>
      </div>
    </div>

    <section id="screen-home" class="panel">
      <header>
        <h1>도지건</h1>
        <p id="player-chip" class="chip">PLAYER - 승률 0% (0승 0패) - 순위 미집계</p>
      </header>
      <div class="actions">
        <button type="button" id="btn-pvp" class="cta alt">빠른 대전</button>
        <button type="button" id="btn-practice" class="cta">연습하기</button>
        <div class="row">
          <button type="button" id="btn-leaderboard">랭킹</button>
          <button type="button" id="btn-settings">설정</button>
          <button type="button" id="btn-tutorial">튜토리얼</button>
        </div>
        <button type="button" id="btn-close">닫기</button>
      </div>
      <p class="hint">WASD 이동 · 마우스 조준 · 클릭 발사 · R 장전</p>
    </section>

    <section id="screen-settings" class="panel" hidden>
      <h2>설정</h2>
      <label class="toggle"><input type="checkbox" id="opt-sound" checked /> 사운드</label>
      <label class="toggle"><input type="checkbox" id="opt-haptic" checked /> 햅틱</label>
      <p class="hint">백그라운드로 나가면 사운드가 멈추고 경기가 일시정지됩니다.</p>
      <button type="button" id="btn-settings-back" class="cta">확인</button>
    </section>

    <section id="screen-match" class="panel" hidden>
      <h2>상대를 찾는 중</h2>
      <p class="lead" id="match-wait">8초 안에 못 찾으면 유저 고스트 또는 AI와 바로 붙습니다</p>
      <p id="match-clock" class="clock">8</p>
      <button type="button" id="btn-cancel-match">취소</button>
    </section>

    <section id="screen-result" class="panel" hidden>
      <h2 id="result-title">승리</h2>
      <p class="mode-label" id="result-tag">연습</p>
      <p id="result-score">2 — 1</p>
      <p id="result-reason" class="lead"></p>
      <div class="actions">
        <button type="button" id="btn-rematch" class="cta">다시 연습</button>
        <button type="button" id="btn-home">홈으로</button>
      </div>
    </section>

    <div id="modal-exit" class="modal" hidden>
      <div class="modal-card">
        <p>도지건을 종료할까요?</p>
        <div class="row">
          <button type="button" id="btn-exit-no">계속하기</button>
          <button type="button" id="btn-exit-yes" class="cta">종료</button>
        </div>
      </div>
    </div>

    <div id="tutorial-done" class="modal" hidden>
      <div class="modal-card">
        <p>훈련 완료!</p>
        <p class="hint">준비됐습니다. 연습 대전에서 감각을 익혀 보세요.</p>
        <div class="row">
          <button type="button" id="btn-tutorial-home">홈으로</button>
          <button type="button" id="btn-tutorial-practice" class="cta">연습 시작</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
