services:
  - type: web
    name: mongjin-api
    runtime: node
    rootDir: server
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: 5
